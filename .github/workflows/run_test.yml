
name: Run Test Cases

on: [pull_request]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get -y install android-tools-adb

      # Publish a live stream for test_play.dart, same way Ant-Media-Enterprise tests do
      - name: Publish test stream
        run: |
          sudo apt-get update && sudo apt-get -y install ffmpeg
          nohup ffmpeg -re -f lavfi -i testsrc=size=640x360:rate=25 -f lavfi -i sine \
            -c:v libx264 -preset veryfast -tune zerolatency -bf 0 -c:a aac \
            -f flv rtmp://test.antmedia.io/WebRTCAppEE/flutter-ci-${{ github.run_id }} > ffmpeg.log 2>&1 &

      - name: Run sample application integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            cd example/SampleProject && flutter test integration_test/test_play.dart --dart-define=STREAM_ID=flutter-ci-${{ github.run_id }}
            cd example/SampleProject && flutter test integration_test/test_conference.dart
